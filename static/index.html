<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 可视化工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    body { font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .step-card { transition: opacity .25s ease; }
    .pipeline-rail { position: relative; }
    .pipeline-rail .rail-line { position:absolute; left:15px; top:0; bottom:0; width:2px; background:#e2e8f0; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display:none; }
    details[open] .chev { transform: rotate(90deg); }
    .chev { transition: transform .15s ease; }
    pre.wrap { white-space: pre-wrap; word-break: break-word; }
    .pre-wrap { white-space: pre-wrap; word-break: break-word; }
    .mode-tab { transition: all .15s ease; }
    .mode-tab.active { background:#fff; color:#4f46e5; box-shadow: 0 1px 2px rgba(15,23,42,.08); font-weight:600; }
    /* 回答里的可点击引用 */
    .cite { cursor:pointer; color:#4f46e5; font-weight:600; border-radius:.375rem; padding:0 .2rem;
            background:#eef2ff; transition:background .15s ease; }
    .cite:hover { background:#c7d2fe; }
    /* 检索块被引用定位时的高亮脉冲 */
    @keyframes rank-flash {
      0% { box-shadow:0 0 0 0 rgba(245,158,11,.75); }
      100% { box-shadow:0 0 0 16px rgba(245,158,11,0); }
    }
    .rank-flash { animation: rank-flash .9s ease-out 2; border-color:#f59e0b !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- 顶栏 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-[1500px] mx-auto px-5 h-14 flex items-center gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white">
          <i class="fa fa-bolt"></i>
        </div>
        <h1 class="text-lg font-semibold tracking-wide">RAG 可视化工作台</h1>
        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">逐步可见</span>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <div id="stat-chip" class="hidden text-xs px-3 py-1.5 rounded-full bg-white border border-slate-200 text-slate-500 mono"></div>
        <button id="btn-settings" class="inline-flex items-center gap-1.5 text-sm px-3.5 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50">
          <i class="fa fa-cog"></i> 设置
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-[1500px] mx-auto px-5 py-5 grid grid-cols-[340px_1fr] gap-5 items-start">

    <!-- 左栏：知识库 -->
    <aside class="space-y-4 sticky top-20">
      <section class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-semibold text-sm flex items-center gap-2">
            <i class="fa fa-database text-indigo-500"></i> 知识库
          </h2>
          <div class="flex items-center gap-1">
            <button id="btn-examples" class="text-xs px-2 py-1 rounded-md bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-100" title="载入内置示例文档">
              <i class="fa fa-magic"></i> 示例
            </button>
            <button id="btn-clear" class="text-xs px-2 py-1 rounded-md bg-rose-50 text-rose-500 hover:bg-rose-100 border border-rose-100" title="清空整个知识库">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>

        <!-- 上传 -->
        <div class="p-3 border-b border-slate-100">
          <label id="dropzone" class="flex flex-col items-center justify-center gap-1.5 py-5 rounded-lg border-2 border-dashed border-slate-200 text-slate-400 hover:border-indigo-300 hover:text-indigo-400 hover:bg-indigo-50/40 cursor-pointer transition-colors">
            <i class="fa fa-cloud-upload text-2xl"></i>
            <span class="text-xs">点击选择或拖拽文档（.pdf / .docx / .txt / .md）</span>
            <span class="text-[10px] text-slate-300">上传后自动：解析 → 清洗 → 切分 → 向量化 → 入库</span>
            <input id="file-input" type="file" accept=".pdf,.docx,.txt,.md,.markdown" class="hidden" multiple />
          </label>
          <div id="upload-hint" class="hidden text-xs mt-2 px-2 py-1.5 rounded-md"></div>
        </div>

        <!-- 文档列表 -->
        <div id="doc-list" class="p-2 max-h-[380px] overflow-y-auto">
          <div class="text-xs text-slate-400 text-center py-6">
            <i class="fa fa-inbox fa-lg block mb-2"></i>
            知识库为空<br/>点击上方「示例」或上传文档开始建库
          </div>
        </div>
      </section>

      <!-- 建库流水 -->
      <section class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-semibold text-sm flex items-center gap-2">
            <i class="fa fa-tasks text-emerald-500"></i> 建库流水
          </h2>
          <span class="text-[10px] text-slate-400">最近处理记录</span>
        </div>
        <div id="ingest-log" class="p-3 max-h-[260px] overflow-y-auto text-xs text-slate-400 text-center">
          暂无记录。上传文档或载入示例后，这里会逐步展示每一步。
        </div>
      </section>
    </aside>

    <!-- 主区 -->
    <main class="space-y-5 min-w-0">

      <!-- 提问 / 内容匹配 框 -->
      <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
          <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
            <button type="button" data-mode="query" class="mode-tab active px-4 py-1.5 rounded-md text-sm text-slate-500">问答生成</button>
            <button type="button" data-mode="match" class="mode-tab px-4 py-1.5 rounded-md text-sm text-slate-500">内容匹配</button>
          </div>
          <span id="mode-hint" class="text-[11px] text-slate-400"></span>
        </div>
        <form id="query-form" class="flex gap-3 items-start">
          <textarea id="q-input" rows="2" autocomplete="off"
            placeholder="输入问题，例如：RAG 中的 Top-K 是什么？分块策略要注意什么？"
            class="flex-1 px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 text-sm leading-relaxed resize-y"></textarea>
          <button id="btn-send" type="submit"
            class="inline-flex items-center gap-2 px-5 py-3 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa fa-paper-plane"></i><span id="btn-send-label">提问</span>
          </button>
        </form>
        <div class="flex flex-wrap gap-2 mt-3" id="chip-row">
          <span class="text-xs text-slate-400 self-center">试试：</span>
          <button class="q-chip text-xs px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-500 hover:text-indigo-600 border border-transparent hover:border-indigo-200">RAG 的 Top-K 是什么</button>
          <button class="q-chip text-xs px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-500 hover:text-indigo-600 border border-transparent hover:border-indigo-200">磷酸铁锂电池有哪些优缺点</button>
          <button class="q-chip text-xs px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-500 hover:text-indigo-600 border border-transparent hover:border-indigo-200">拙政园名字的由来</button>
          <button class="q-chip text-xs px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-500 hover:text-indigo-600 border border-transparent hover:border-indigo-200">如何延长电池寿命</button>
        </div>
        <label id="llm-wrap" class="hidden items-center gap-2 text-xs text-slate-500 mt-3 cursor-pointer">
          <input type="checkbox" id="with-llm" class="accent-indigo-500" />
          <span>让模型解读匹配结果与待匹配文本的关系（会额外消耗一次生成调用）</span>
        </label>
        <div class="flex flex-wrap items-center gap-x-6 gap-y-2 mt-3 pt-3 border-t border-slate-100 text-xs text-slate-500">
          <label class="flex items-center gap-2"><span>Top-K</span>
            <input id="ctl-topk" type="number" min="1" max="20" value="5"
              class="mono w-16 px-2 py-1.5 rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
          </label>
          <label class="flex items-center gap-2"><span>相似度阈值</span>
            <input id="ctl-mscore" type="number" min="0" max="1" step="0.05" value="0"
              class="mono w-16 px-2 py-1.5 rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
          </label>
          <span class="text-[11px] text-slate-400">低于阈值的命中会被过滤；改动即时保存，问答与匹配共用</span>
        </div>
      </section>

      <!-- 流程流水（问答 / 内容匹配） -->
      <section id="query-flow" class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
          <h2 class="font-semibold text-sm flex items-center gap-2">
            <i class="fa fa-sitemap text-violet-500"></i> <span id="flow-title">问答流水</span>
          </h2>
          <div class="flex items-center gap-3 min-w-0">
            <div id="query-meta" class="text-xs text-slate-400 truncate"></div>
            <button id="btn-export" class="hidden flex-none text-xs px-2.5 py-1.5 rounded-md bg-slate-100 hover:bg-indigo-100 text-slate-500 hover:text-indigo-600 border border-transparent hover:border-indigo-200" title="把当前流水导出为 Markdown">
              <i class="fa fa-download"></i> 导出 MD
            </button>
          </div>
        </div>
        <div id="query-body" class="p-4"></div>
      </section>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white">
        <h3 class="font-semibold flex items-center gap-2"><i class="fa fa-cog text-indigo-500"></i> 设置</h3>
        <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
      </div>
      <div class="p-5 space-y-4 text-sm">
        <div>
          <label class="flex items-center justify-between text-slate-600 mb-1">
            <span><i class="fa fa-key text-amber-500 mr-1"></i> 阿里云百炼 API Key</span>
            <span id="key-status" class="text-xs px-2 py-0.5 rounded-full"></span>
          </label>
          <input id="cfg-key" type="password" placeholder="sk-… 仅在本地保存，不会上传任何服务器"
            class="mono w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
          <div class="flex gap-2 mt-2">
            <button id="btn-test" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600">测试连接</button>
            <a class="text-xs self-center text-indigo-500 hover:underline" href="https://bailian.console.aliyun.com/" target="_blank">去百炼控制台获取 →</a>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-slate-600 mb-1 block">生成模型</label>
            <select id="cfg-llm" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
              <option>qwen-plus</option><option>qwen-max</option><option>qwen-turbo</option><option>qwen-long</option>
            </select>
          </div>
          <div>
            <label class="text-slate-600 mb-1 block">嵌入模型</label>
            <select id="cfg-emb" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
              <option>text-embedding-v3</option><option>text-embedding-v4</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-slate-600 mb-1 block">向量维度</label>
          <select id="cfg-dim" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white">
            <option>1024</option><option>768</option><option>512</option>
          </select>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-slate-600 text-sm font-medium"><i class="fa fa-eraser text-sky-500 mr-1"></i> 入库前数据清洗</span>
            <label class="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer">
              <input type="checkbox" id="cfg-clean-en" class="accent-emerald-500" /> 启用
            </label>
          </div>
          <div class="rounded-lg border border-slate-200 p-3 space-y-2 mt-1">
            <div class="flex items-center justify-between text-slate-500 text-xs">
              <span><i class="fa fa-check text-emerald-500 mr-1"></i>基础规范化（换行/零宽字符/空行压缩，始终执行）</span>
            </div>
            <label class="flex items-center justify-between text-slate-500 text-xs cursor-pointer">
              <span>剔除页码 / 页眉页脚 / 分隔线</span>
              <input type="checkbox" id="cfg-clean-noise" class="accent-indigo-500" />
            </label>
            <label class="flex items-center justify-between text-slate-500 text-xs cursor-pointer">
              <span>去除全篇重复行（如每页重复的表头）</span>
              <input type="checkbox" id="cfg-clean-dedup" class="accent-indigo-500" />
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-slate-600 mb-1 block">切分大小（字符）</label>
            <input id="cfg-cs" type="number" min="50" step="10" class="w-full px-3 py-2 rounded-lg border border-slate-200" />
          </div>
          <div>
            <label class="text-slate-600 mb-1 block">切分重叠</label>
            <input id="cfg-co" type="number" min="0" class="w-full px-3 py-2 rounded-lg border border-slate-200" />
          </div>
        </div>
        <p class="text-xs text-amber-600 bg-amber-50 rounded-lg px-3 py-2">
          <i class="fa fa-info-circle mr-1"></i>修改切分大小/重叠/嵌入模型或开启数据清洗后，需「清空知识库」并重新建库才会生效。Top-K 与相似度阈值已移至主界面即时调整。
        </p>

        <div class="flex justify-end gap-2 pt-1">
          <button id="btn-save-settings" class="px-5 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-500">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-800 text-white text-sm shadow-xl"></div>

  <script src="/static/app.js"></script>
</body>
</html>
